  <rect x="650" y="130" rx="18" width="220" height="140" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="760" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Data Operations Hub</text>
  <text x="760" y="205" text-anchor="middle" font-size="15" fill="#6b7280">validate • monitor • triage</text>
  <text x="760" y="234" text-anchor="middle" font-size="14" fill="#6b7280">AS2 • SFTP • VAN</text>
  <rect x="940" y="150" rx="18" width="190" height="100" fill="#f3f4f6" stroke="#d1d5db"/>
