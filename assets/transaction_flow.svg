<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<rect width="1200" height="360" fill="#ffffff"/>
<text x="60" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">B2B Transaction Flow</text>
<text x="60" y="92" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Synthetic distributor-network workflow modeled in this portfolio</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>
<g font-family="Arial, sans-serif">
  <rect x="70" y="150" rx="18" width="220" height="100" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="180" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Business Customer</text>
  <text x="180" y="220" text-anchor="middle" font-size="15" fill="#6b7280">120 synthetic accounts</text>
  <rect x="360" y="150" rx="18" width="220" height="100" fill="#eff6ff" stroke="#93c5fd"/>
