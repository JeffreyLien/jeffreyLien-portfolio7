  <text x="1035" y="220" text-anchor="middle" font-size="15" fill="#6b7280">40 trading partners</text>
  <line x1="290" y1="200" x2="350" y2="200" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="580" y1="200" x2="640" y2="200" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="870" y1="200" x2="930" y2="200" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="325" y="182" text-anchor="middle" font-size="13" fill="#6b7280">Order</text>
  <text x="615" y="182" text-anchor="middle" font-size="13" fill="#6b7280">850-like</text>
  <text x="900" y="170" text-anchor="middle" font-size="13" fill="#6b7280">855 / 856 / 810</text>
